<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b81f2a">
  <meta name="description" content="Paylasilan Parca Cini ilanini uygulamada acin.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; img-src 'none'">
  <title>Parça Cini — İlanı Uygulamada Aç</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f5f6f8;color:#1c2533;display:flex;align-items:center;justify-content:center;padding:20px}
    main{width:min(480px,100%);background:white;border-radius:20px;padding:30px;box-shadow:0 10px 40px #18263c16}
    header{font-weight:900;color:#b81f2a;letter-spacing:.4px;font-size:24px}
    h1{font-size:23px;margin:24px 0 12px;line-height:1.3}
    p{line-height:1.65;color:#485567}
    .code{border:1px solid #e3e6ec;border-radius:12px;padding:13px;overflow-wrap:anywhere;background:#fafbfc;font-size:13px}
    a.primary{display:block;text-align:center;background:#b81f2a;color:#fff;padding:14px 18px;border-radius:12px;text-decoration:none;font-weight:750;margin-top:22px}
    a.primary:hover{background:#991923}
    small{display:block;margin-top:22px;line-height:1.6;color:#667387}
    .error{color:#a12128}
  </style>
</head>
<body>
<main data-version="pc-share-test-v2">
  <header>PARÇA CİNİ</header>
  <h1>İlanı uygulamada aç</h1>
  <p id="message">Paylaşılan ilan bağlantısı kontrol ediliyor.</p>
  <div id="code" class="code" hidden></div>
  <a id="open" class="primary" href="#" hidden>Parça Cini TEST'te Aç</a>
  <small>Test aşamasıdır. Bu sayfa ilan bilgilerini internette yayımlamaz; yalnızca ilan kodunu Parça Cini TEST uygulamasına gönderir. Uygulama yüklü değilse açma düğmesi çalışmayabilir.</small>
</main>
<script>
(() => {
  'use strict';
  const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const id = new URLSearchParams(window.location.search).get('id');
  const msg = document.getElementById('message');
  if (!id || !uuid.test(id)) {
    msg.className = 'error';
    msg.textContent = 'Gecersiz veya eksik ilan kodu. Gonderilen baglantiyi kontrol edin.';
    return;
  }
  msg.textContent = 'Bu ilani Parca Cini TEST uygulamasinda goruntuleyebilirsiniz.';
  const code = document.getElementById('code');
  code.hidden = false;
  code.textContent = 'İlan kodu: ' + id;
  const button = document.getElementById('open');
  // User must tap to launch. Chrome does not permit silent external-app launches.
  // Package pinning keeps the original Parca Cini app untouched.
  button.href = 'intent://ilan?id=' + encodeURIComponent(id) + '#Intent;scheme=parcacinisharetest;package=com.parcacini.app.sharetest;end';
  button.hidden = false;
})();
</script>
</body>
</html>
